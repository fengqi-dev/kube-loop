apiVersion: v1
kind: Namespace
metadata:
  name: kubeloop-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-httpbin
  namespace: kubeloop-demo
  labels:
    app.kubernetes.io/name: go-httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-httpbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-httpbin
    spec:
      containers:
        - name: go-httpbin
          image: mccutchen/go-httpbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status/200
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-httpbin
  namespace: kubeloop-demo
  labels:
    app.kubernetes.io/name: go-httpbin
spec:
  selector:
    app.kubernetes.io/name: go-httpbin
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpcbin
  namespace: kubeloop-demo
  labels:
    app.kubernetes.io/name: grpcbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grpcbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grpcbin
    spec:
      containers:
        - name: grpcbin
          image: kong/grpcbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grpcbin
  namespace: kubeloop-demo
  labels:
    app.kubernetes.io/name: grpcbin
spec:
  selector:
    app.kubernetes.io/name: grpcbin
  ports:
    - name: grpc
      appProtocol: grpc
      port: 9000
      targetPort: grpc
      protocol: TCP
