# nfpm config for KubeLoop Linux packages (deb / rpm).
# VERSION and GOARCH are expanded from the environment.
name: kubeloop
arch: ${GOARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: KubeLoop <noreply@users.noreply.github.com>
description: |
  Local development network for Kubernetes.
  Connect your laptop to a cluster with TUN routing, DNS, and port tools.
vendor: KubeLoop
homepage: https://github.com/fengqi-dev/kube-loop
license: MIT

scripts:
  postinstall: ./build/linux/update-desktop-database.sh
  postremove: ./build/linux/update-desktop-database.sh

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

contents:
  - src: ./build/bin/KubeLoop
    dst: /usr/bin/kubeloop
    file_info:
      mode: 0755
  - src: ./build/bin/sing-box
    dst: /usr/lib/kubeloop/sing-box
    file_info:
      mode: 0755
  - src: ./build/bin/LICENSE.sing-box.txt
    dst: /usr/share/doc/kubeloop/LICENSE.sing-box.txt
  - src: ./build/linux/kubeloop.desktop
    dst: /usr/share/applications/kubeloop.desktop
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/kubeloop.png
  - src: ./build/appicon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/kubeloop.svg
