{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled=true" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubeloop.fullname" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubeloop.controlPlaneName" . }}
                port:
                  name: http
          - path: /kubeloop/api
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubeloop.controlPlaneName" . }}
                port:
                  name: http
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubeloop.controlPlaneName" . }}
                port:
                  name: http
          - path: {{ .Values.dataPlane.tunnelPath }}
            pathType: Exact
            backend:
              service:
                name: {{ include "kubeloop.dataPlaneName" . }}
                port:
                  name: http
          - path: /traffic/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubeloop.dataPlaneName" . }}
                port:
                  name: http
{{- end }}
