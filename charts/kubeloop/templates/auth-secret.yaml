{{- $oauth := .Values.controlPlane.auth.oauth -}}
{{- if not $oauth.existingSecret -}}
{{- $name := include "kubeloop.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $oidcKey := required "controlPlane.auth.oauth.oidcSigningKeyKey is required" $oauth.oidcSigningKeyKey -}}
{{- $hmacKey := required "controlPlane.auth.oauth.hmacSecretKey is required" $oauth.hmacSecretKey -}}
{{- $oidc := genPrivateKey "ecdsa" | b64enc -}}
{{- $hmac := randAlphaNum 32 | b64enc -}}
{{- if and $existing $existing.data -}}
{{- $oidc = default $oidc (index $existing.data $oidcKey) -}}
{{- $hmac = default $hmac (index $existing.data $hmacKey) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $oidcKey }}: {{ $oidc | quote }}
  {{ $hmacKey }}: {{ $hmac | quote }}
{{- end }}
