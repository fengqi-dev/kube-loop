{{- $oauth := .Values.controlPlane.auth.oauth -}}
{{- $bootstrap := .Values.controlPlane.admin.bootstrap -}}
{{- $name := include "kubeloop.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $oidcKey := required "controlPlane.auth.oauth.oidcSigningKeyKey is required" $oauth.oidcSigningKeyKey -}}
{{- $hmacKey := required "controlPlane.auth.oauth.hmacSecretKey is required" $oauth.hmacSecretKey -}}
{{- $oidc := genPrivateKey "ecdsa" | b64enc -}}
{{- $hmac := randAlphaNum 32 | b64enc -}}
{{- $passwordKey := $bootstrap.passwordKey -}}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- if and $bootstrap.enabled (empty $passwordKey) -}}
{{- fail "controlPlane.admin.bootstrap.passwordKey is required" -}}
{{- end -}}
{{- if or (and $bootstrap.enabled (eq $passwordKey $oidcKey)) (and $bootstrap.enabled (eq $passwordKey $hmacKey)) (eq $oidcKey $hmacKey) -}}
{{- fail "Control Plane auth Secret key names must be distinct" -}}
{{- end -}}
{{- if and $existing $existing.data -}}
{{- $oidc = default $oidc (index $existing.data $oidcKey) -}}
{{- $hmac = default $hmac (index $existing.data $hmacKey) -}}
{{- if $bootstrap.enabled -}}
{{- $password = default $password (index $existing.data $passwordKey) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $oidcKey }}: {{ $oidc | quote }}
  {{ $hmacKey }}: {{ $hmac | quote }}
  {{- if $bootstrap.enabled }}
  {{ $passwordKey }}: {{ $password | quote }}
  {{- end }}
