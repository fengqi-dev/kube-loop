{{- $publicURL := required "publicURL is required (for example https://kubeloop.example.com)" .Values.publicURL -}}
{{- $datasourceSecret := .Values.controlPlane.storage.datasource.existingSecret -}}
{{- if and (not $datasourceSecret) (ne (int .Values.controlPlane.replicas) 1) -}}
{{- fail "controlPlane.replicas must be 1 when using default SQLite storage" -}}
{{- end }}
{{- if and $datasourceSecret (le (int .Values.controlPlane.storage.maxOpenConnections) 0) -}}
{{- fail "controlPlane.storage.maxOpenConnections must be positive" -}}
{{- end }}
{{- if and $datasourceSecret (lt (int .Values.controlPlane.storage.maxIdleConnections) 0) -}}
{{- fail "controlPlane.storage.maxIdleConnections must not be negative" -}}
{{- end }}
{{- if and $datasourceSecret (gt (int .Values.controlPlane.storage.maxIdleConnections) (int .Values.controlPlane.storage.maxOpenConnections)) -}}
{{- fail "controlPlane.storage.maxIdleConnections must not exceed maxOpenConnections" -}}
{{- end }}
{{- if and $datasourceSecret (or (lt (int .Values.controlPlane.storage.transactionMaxRetries) 0) (gt (int .Values.controlPlane.storage.transactionMaxRetries) 10)) -}}
{{- fail "controlPlane.storage.transactionMaxRetries must be between 0 and 10" -}}
{{- end }}
{{- if ne (int .Values.controlPlane.replicas) 1 -}}
{{- fail "controlPlane.replicas must be 1 while using the in-memory Relay Registry" -}}
{{- end }}
{{- $controlPlaneLogLevel := lower (toString .Values.controlPlane.logLevel) -}}
{{- if not (has $controlPlaneLogLevel (list "debug" "info" "warn" "error")) -}}
{{- fail "controlPlane.logLevel must be debug, info, warn, or error" -}}
{{- end }}
{{- $providerSecretAliases := default (dict) .Values.controlPlane.management.providerSecretAliases -}}
{{- $initialAdmin := .Values.controlPlane.management.initialAdmin -}}
{{- $tokenSecretName := .Values.controlPlane.auth.token.existingSecret -}}
{{- if and (not $tokenSecretName) $initialAdmin.enabled (not $initialAdmin.existingSecret) -}}
{{- $tokenSecretName = include "kubeloop.initialAdminSecretName" . -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeloop.controlPlaneName" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  strategy:
    type: {{ ternary "Recreate" "RollingUpdate" (not $datasourceSecret) }}
  selector:
    matchLabels:
      {{- include "kubeloop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      {{- with .Values.controlPlane.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubeloop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
        {{- with .Values.controlPlane.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kubeloop.controlPlaneServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.controlPlane.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "kubeloop.controlPlaneImage" . | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          args:
            - --config=/etc/kubeloop/control-plane.yaml
          env:
            - name: KUBELOOP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: {{ .Values.controlPlane.management.listenPort }}
              protocol: TCP
            - name: relay-mtls
              containerPort: {{ .Values.controlPlane.relayRegistry.listenPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: control-plane-config
              mountPath: /etc/kubeloop
              readOnly: true
            - name: auth-secrets
              mountPath: /var/run/secrets/kubeloop/auth
              readOnly: true
            {{- if or $initialAdmin.enabled $providerSecretAliases }}
            - name: management-secrets
              mountPath: /var/run/secrets/kubeloop/management
              readOnly: true
            {{- end }}
            - name: relay-registry-tls
              mountPath: /var/run/secrets/kubeloop/relay-registry
              readOnly: true
            {{- if not $datasourceSecret }}
            - name: data
              mountPath: {{ dir .Values.controlPlane.storage.sqlite.path }}
            {{- else }}
            - name: storage-secret
              mountPath: /var/run/secrets/kubeloop/storage
              readOnly: true
            {{- end }}
      volumes:
        - name: control-plane-config
          configMap:
            name: {{ include "kubeloop.controlPlaneConfigName" . }}
        - name: auth-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ required "controlPlane.relay.existingSecret is required" .Values.controlPlane.relay.existingSecret }}
                  items:
                    - key: {{ required "controlPlane.relay.signingKeyKey is required" .Values.controlPlane.relay.signingKeyKey }}
                      path: relay/signing-key.pem
              {{- if or .Values.controlPlane.auth.providers $providerSecretAliases $initialAdmin.enabled }}
              - secret:
                  name: {{ required "controlPlane.auth.token.existingSecret is required when the initial administrator uses an existing Secret" $tokenSecretName }}
                  items:
                    - key: {{ required "controlPlane.auth.token.signingKeyKey is required" .Values.controlPlane.auth.token.signingKeyKey }}
                      path: token/signing-key.pem
              {{- end }}
              {{- if .Values.controlPlane.auth.providers }}
              {{- range $index, $provider := .Values.controlPlane.auth.providers }}
              {{- $id := required (printf "controlPlane.auth.providers[%d].id is required" $index) $provider.id }}
              {{- $type := required (printf "controlPlane.auth.providers[%d].type is required" $index) $provider.type }}
              {{- if eq $type "oidc" }}
              {{- $oidc := required (printf "controlPlane.auth.providers[%d].oidc is required" $index) $provider.oidc }}
              - secret:
                  name: {{ required (printf "controlPlane.auth.providers[%d].oidc.existingSecret is required" $index) $oidc.existingSecret }}
                  items:
                    - key: {{ required (printf "controlPlane.auth.providers[%d].oidc.clientSecretKey is required" $index) $oidc.clientSecretKey }}
                      path: {{ printf "%s/client-secret" $id | quote }}
                    {{- if $oidc.caKey }}
                    - key: {{ $oidc.caKey }}
                      path: {{ printf "%s/ca.crt" $id | quote }}
                    {{- end }}
              {{- else }}
              {{- fail (printf "controlPlane.auth.providers[%d].type must be oidc" $index) }}
              {{- end }}
              {{- end }}
              {{- end }}
        {{- if or $initialAdmin.enabled $providerSecretAliases }}
        - name: management-secrets
          projected:
            defaultMode: 0400
            sources:
              {{- if $initialAdmin.enabled }}
              - secret:
                  name: {{ include "kubeloop.initialAdminSecretName" . }}
                  items:
                    - key: {{ required "controlPlane.management.initialAdmin.usernameKey is required" $initialAdmin.usernameKey }}
                      path: initial-admin/username
                    - key: {{ required "controlPlane.management.initialAdmin.passwordKey is required" $initialAdmin.passwordKey }}
                      path: initial-admin/password
                    - key: {{ required "controlPlane.management.initialAdmin.mfaEncryptionKeyKey is required" $initialAdmin.mfaEncryptionKeyKey }}
                      path: initial-admin/mfa-encryption-key
              {{- end }}
              {{- range $alias, $secret := $providerSecretAliases }}
              - secret:
                  name: {{ required (printf "controlPlane.management.providerSecretAliases.%s.existingSecret is required" $alias) $secret.existingSecret }}
                  items:
                    {{- if $secret.clientSecretKey }}
                    - key: {{ $secret.clientSecretKey }}
                      path: {{ printf "providers/%s/client-secret" $alias | quote }}
                    {{- end }}
                    {{- if $secret.caKey }}
                    - key: {{ $secret.caKey }}
                      path: {{ printf "providers/%s/ca.crt" $alias | quote }}
                    {{- end }}
              {{- end }}
        {{- end }}
        - name: relay-registry-tls
          secret:
            secretName: {{ default .Values.controlPlane.relay.existingSecret .Values.controlPlane.relayRegistry.existingSecret | required "controlPlane.relayRegistry.existingSecret or controlPlane.relay.existingSecret is required" }}
            defaultMode: 0400
            items:
              - key: {{ required "controlPlane.relayRegistry.serverCertificateKey is required" .Values.controlPlane.relayRegistry.serverCertificateKey }}
                path: tls.crt
              - key: {{ required "controlPlane.relayRegistry.serverPrivateKeyKey is required" .Values.controlPlane.relayRegistry.serverPrivateKeyKey }}
                path: tls.key
              - key: {{ required "controlPlane.relayRegistry.caKey is required" .Values.controlPlane.relayRegistry.caKey }}
                path: ca.crt
        {{- if not $datasourceSecret }}
        - name: data
          {{- if .Values.controlPlane.storage.sqlite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubeloop.sqliteClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- else }}
        - name: storage-secret
          secret:
            secretName: {{ .Values.controlPlane.storage.datasource.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.controlPlane.storage.datasource.urlKey }}
                path: datasource-url
        {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
