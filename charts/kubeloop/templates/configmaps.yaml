{{- $publicURL := required "publicURL is required (for example https://kubeloop.example.com)" .Values.publicURL }}
{{- include "kubeloop.validateExternalAccess" . }}
{{- if not (or (eq .Values.controlPlane.relayRegistry.authentication "tokenreview") (eq .Values.controlPlane.relayRegistry.authentication "mtls")) }}
{{- fail "controlPlane.relayRegistry.authentication must be tokenreview or mtls" }}
{{- end }}
{{- if not .Values.controlPlane.files.allowedRoots }}
{{- fail "controlPlane.files.allowedRoots must contain at least one absolute container path" }}
{{- end }}
{{- if le (int64 .Values.controlPlane.files.maxBytes) 0 }}
{{- fail "controlPlane.files.maxBytes must be positive" }}
{{- end }}
{{- if or (lt (int .Values.dataPlane.relayRegistry.maxWebSocketSessionsPerUser) 1) (gt (int .Values.dataPlane.relayRegistry.maxWebSocketSessionsPerUser) (int .Values.dataPlane.relayRegistry.maxWebSocketSessions)) }}
{{- fail "dataPlane.relayRegistry.maxWebSocketSessionsPerUser must be between 1 and maxWebSocketSessions" }}
{{- end }}
{{- if or (lt (int64 .Values.dataPlane.relayRegistry.maxWebSocketFrameBytes) 8192) (gt (int64 .Values.dataPlane.relayRegistry.maxWebSocketFrameBytes) 16777216) }}
{{- fail "dataPlane.relayRegistry.maxWebSocketFrameBytes must be between 8192 and 16777216" }}
{{- end }}
{{- $management := .Values.controlPlane.management }}
{{- if or (lt (int $management.listenPort) 1) (gt (int $management.listenPort) 65535) }}
{{- fail "controlPlane.management.listenPort must be between 1 and 65535" }}
{{- end }}
{{- if or (lt (int $management.servicePort) 1) (gt (int $management.servicePort) 65535) }}
{{- fail "controlPlane.management.servicePort must be between 1 and 65535" }}
{{- end }}
{{- if eq (int $management.listenPort) 8080 }}
{{- fail "controlPlane.management.listenPort must differ from the public Control Plane port 8080" }}
{{- end }}
{{- if eq (int $management.listenPort) (int .Values.controlPlane.relayRegistry.listenPort) }}
{{- fail "controlPlane.management.listenPort must differ from controlPlane.relayRegistry.listenPort" }}
{{- end }}
{{- $managementPublicURL := required "controlPlane.management.publicURL is required" $management.publicURL }}
{{- $bootstrap := $management.bootstrap }}
{{- range $index, $subject := $bootstrap.subjects }}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $subject) }}
{{- fail (printf "controlPlane.management.bootstrap.subjects[%d] must be an exact stable Principal UUID" $index) }}
{{- end }}
{{- end }}
{{- range $index, $group := $bootstrap.groups }}
{{- if or (not $group) (eq $group "*") (eq $group "$cluster") }}
{{- fail (printf "controlPlane.management.bootstrap.groups[%d] must be an exact stable group" $index) }}
{{- end }}
{{- end }}
{{- if and $bootstrap.recoveryEnabled (not (or $bootstrap.subjects $bootstrap.groups)) }}
{{- fail "controlPlane.management.bootstrap.recoveryEnabled requires a bootstrap subject or group" }}
{{- end }}
{{- $providerSecretAliases := dict }}
{{- range $alias, $secret := (default (dict) $management.providerSecretAliases) }}
{{- if not (regexMatch "^[a-z][a-z0-9-]{0,62}$" $alias) }}
{{- fail (printf "controlPlane.management.providerSecretAliases.%s must use a valid stable alias" $alias) }}
{{- end }}
{{- $_ := required (printf "controlPlane.management.providerSecretAliases.%s.existingSecret is required" $alias) $secret.existingSecret }}
{{- if not (or $secret.clientSecretKey $secret.caKey) }}
{{- fail (printf "controlPlane.management.providerSecretAliases.%s must project at least one key" $alias) }}
{{- end }}
{{- $files := dict }}
{{- if $secret.clientSecretKey }}
{{- $_ := set $files "clientSecretFile" (printf "/var/run/secrets/kubeloop/management/providers/%s/client-secret" $alias) }}
{{- end }}
{{- if $secret.caKey }}
{{- $_ := set $files "caFile" (printf "/var/run/secrets/kubeloop/management/providers/%s/ca.crt" $alias) }}
{{- end }}
{{- $_ := set $providerSecretAliases $alias $files }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeloop.controlPlaneConfigName" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
data:
  KUBELOOP_LISTEN: ":8080"
  KUBELOOP_PUBLIC_URL: {{ $publicURL | quote }}
  KUBELOOP_MANAGEMENT_LISTEN: {{ printf ":%v" $management.listenPort | quote }}
  KUBELOOP_MANAGEMENT_PUBLIC_URL: {{ $managementPublicURL | quote }}
  KUBELOOP_SERVICE_ID: {{ include "kubeloop.serviceID" . | quote }}
  KUBELOOP_TUNNEL_PATH: {{ .Values.dataPlane.tunnelPath | quote }}
  KUBELOOP_MIN_CLIENT_VERSION: {{ .Values.controlPlane.minClientVersion | quote }}
  KUBELOOP_AUTH_CONFIG_FILE: "/etc/kubeloop/auth/auth.json"
  KUBELOOP_POLICY_CONFIG_FILE: "/etc/kubeloop/auth/policy.json"
  KUBELOOP_MANAGEMENT_CONFIG_FILE: "/etc/kubeloop/auth/management.json"
  {{- if .Values.controlPlane.management.initialAdmin.enabled }}
  KUBELOOP_INITIAL_ADMIN_USERNAME_FILE: "/var/run/secrets/kubeloop/management/initial-admin/username"
  KUBELOOP_INITIAL_ADMIN_PASSWORD_FILE: "/var/run/secrets/kubeloop/management/initial-admin/password"
  KUBELOOP_MANAGEMENT_MFA_KEY_FILE: "/var/run/secrets/kubeloop/management/initial-admin/mfa-encryption-key"
  {{- end }}
  KUBELOOP_KUBERNETES_CONFIG_FILE: "/etc/kubeloop/auth/kubernetes.json"
  KUBELOOP_TOKEN_SIGNING_KEY_FILE: "/var/run/secrets/kubeloop/auth/token/signing-key.pem"
  KUBELOOP_TOKEN_KEY_ID: {{ .Values.controlPlane.auth.token.keyID | quote }}
  KUBELOOP_ACCESS_TOKEN_TTL: {{ .Values.controlPlane.auth.token.accessTTL | quote }}
  KUBELOOP_REFRESH_TOKEN_TTL: {{ .Values.controlPlane.auth.token.refreshTTL | quote }}
  KUBELOOP_RELAY_TICKET_SIGNING_KEY_FILE: "/var/run/secrets/kubeloop/auth/relay/signing-key.pem"
  KUBELOOP_RELAY_TICKET_KEY_ID: {{ .Values.controlPlane.relay.keyID | quote }}
  KUBELOOP_RELAY_TICKET_TTL: {{ .Values.controlPlane.relay.ticketTTL | quote }}
  KUBELOOP_RELAY_REGISTRY_LISTEN: {{ printf ":%v" .Values.controlPlane.relayRegistry.listenPort | quote }}
  KUBELOOP_RELAY_REGISTRY_CERT_FILE: "/var/run/secrets/kubeloop/relay-registry/tls.crt"
  KUBELOOP_RELAY_REGISTRY_KEY_FILE: "/var/run/secrets/kubeloop/relay-registry/tls.key"
  KUBELOOP_RELAY_REGISTRY_AUTHENTICATION: {{ .Values.controlPlane.relayRegistry.authentication | quote }}
  KUBELOOP_RELAY_TOKEN_AUDIENCE: {{ .Values.controlPlane.relayRegistry.tokenAudience | quote }}
  KUBELOOP_RELAY_TRUST_DOMAIN: {{ .Values.controlPlane.relayRegistry.trustDomain | quote }}
  KUBELOOP_RELAY_ENDPOINT_ALLOWED_HOSTS: {{ .Values.controlPlane.relayRegistry.endpointAllowedHosts | quote }}
  KUBELOOP_RELAY_LEASE_DURATION: {{ .Values.controlPlane.relayRegistry.leaseDuration | quote }}
  KUBELOOP_RELAY_HEARTBEAT_AFTER: {{ .Values.controlPlane.relayRegistry.heartbeatAfter | quote }}
  KUBELOOP_RELAY_KEY_GENERATION: {{ .Values.controlPlane.relayRegistry.keyGeneration | quote }}
  KUBELOOP_RELAY_KEY_VALIDITY: {{ .Values.controlPlane.relayRegistry.keyValidity | quote }}
  {{- if eq .Values.controlPlane.relayRegistry.authentication "mtls" }}
  KUBELOOP_RELAY_REGISTRY_CLIENT_CA_FILE: "/var/run/secrets/kubeloop/relay-registry/ca.crt"
  {{- end }}
  KUBELOOP_CONTROL_PLANE_REPLICAS: {{ .Values.controlPlane.replicas | quote }}
  KUBELOOP_FILE_MAX_BYTES: {{ .Values.controlPlane.files.maxBytes | int64 | quote }}
  KUBELOOP_FILE_ALLOWED_ROOTS_JSON: {{ .Values.controlPlane.files.allowedRoots | toJson | quote }}
---
{{- $providers := list }}
{{- range $index, $provider := .Values.controlPlane.auth.providers }}
{{- $id := required (printf "controlPlane.auth.providers[%d].id is required" $index) $provider.id }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" $id) }}
{{- fail (printf "controlPlane.auth.providers[%d].id must be URL-safe" $index) }}
{{- end }}
{{- $type := required (printf "controlPlane.auth.providers[%d].type is required" $index) $provider.type }}
{{- if eq $type "oidc" }}
{{- $oidc := required (printf "controlPlane.auth.providers[%d].oidc is required" $index) $provider.oidc }}
{{- $issuer := required (printf "controlPlane.auth.providers[%d].oidc.issuer is required" $index) $oidc.issuer }}
{{- $clientID := required (printf "controlPlane.auth.providers[%d].oidc.clientID is required" $index) $oidc.clientID }}
{{- $_ := required (printf "controlPlane.auth.providers[%d].oidc.existingSecret is required" $index) $oidc.existingSecret }}
{{- $_ := required (printf "controlPlane.auth.providers[%d].oidc.clientSecretKey is required" $index) $oidc.clientSecretKey }}
{{- $oidcConfig := dict
      "issuer" $issuer
      "clientId" $clientID
      "clientSecretFile" (printf "/var/run/secrets/kubeloop/auth/%s/client-secret" $id)
      "redirectUrl" (printf "%s/oauth2/callback/%s" (trimSuffix "/" $publicURL) $id)
      "scopes" (default (list "openid" "profile" "email") $oidc.scopes)
      "allowedSigningAlgs" (default (list "RS256") $oidc.allowedSigningAlgs)
      "requiredClaims" (default (list "sub") $oidc.requiredClaims)
      "claims" (default (dict) $oidc.claims)
      "httpTimeout" (default "10s" $oidc.httpTimeout)
}}
{{- if $oidc.caKey }}
{{- $_ := set $oidcConfig "caFile" (printf "/var/run/secrets/kubeloop/auth/%s/ca.crt" $id) }}
{{- end }}
{{- $providers = append $providers (dict "id" $id "type" $type "displayName" (default "" $provider.displayName) "oidc" $oidcConfig) }}
{{- else if eq $type "anonymous" }}
{{- if not $.Values.controlPlane.auth.developmentMode }}
{{- fail (printf "controlPlane.auth.providers[%d] anonymous requires controlPlane.auth.developmentMode=true" $index) }}
{{- end }}
{{- $anonymous := required (printf "controlPlane.auth.providers[%d].anonymous is required" $index) $provider.anonymous }}
{{- $anonymousConfig := dict
      "subject" (default "anonymous" $anonymous.subject)
      "displayName" (default "" $anonymous.displayName)
      "email" (default "" $anonymous.email)
      "groups" (default (list) $anonymous.groups)
}}
{{- $providers = append $providers (dict "id" $id "type" $type "displayName" (default "" $provider.displayName) "anonymous" $anonymousConfig) }}
{{- else }}
{{- fail (printf "controlPlane.auth.providers[%d].type must be oidc or anonymous" $index) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeloop.controlPlaneAuthConfigName" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
data:
  auth.json: {{ dict "developmentMode" .Values.controlPlane.auth.developmentMode "providers" $providers | toJson | quote }}
  policy.json: {{ dict "version" 1 "rules" (default (list) .Values.controlPlane.policy.rules) | toJson | quote }}
  management.json: {{ dict "bootstrap" (dict "subjects" (default (list) $bootstrap.subjects) "groups" (default (list) $bootstrap.groups) "recoveryEnabled" $bootstrap.recoveryEnabled) "providerSecretAliases" $providerSecretAliases | toJson | quote }}
  kubernetes.json: {{ dict "timeout" .Values.controlPlane.kubernetes.timeout "qps" .Values.controlPlane.kubernetes.qps "burst" .Values.controlPlane.kubernetes.burst "userAgent" .Values.controlPlane.kubernetes.userAgent "impersonation" (dict "enabled" .Values.controlPlane.kubernetes.impersonation.enabled "usernamePrefix" .Values.controlPlane.kubernetes.impersonation.usernamePrefix "groupMappings" (default (dict) .Values.controlPlane.kubernetes.impersonation.groupMappings)) | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeloop.dataPlaneConfigName" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
data:
  {{- if and (not .Values.dataPlane.relayRegistry.endpoint) (not (hasPrefix "https://" $publicURL)) }}
  {{- fail "dataPlane.relayRegistry.endpoint is required when publicURL is not HTTPS" }}
  {{- end }}
  {{- $gatewayRelay := dict
    "controlPlaneURL" (default (printf "https://%s.%s.svc:%v" (include "kubeloop.controlPlaneRegistryName" .) .Release.Namespace .Values.controlPlane.relayRegistry.servicePort) .Values.dataPlane.relayRegistry.controlPlaneURL)
    "endpoint" (default (printf "wss://%s%s" (trimPrefix "https://" (trimSuffix "/" $publicURL)) .Values.dataPlane.tunnelPath) .Values.dataPlane.relayRegistry.endpoint)
    "serverCAFile" "/var/run/secrets/kubeloop/relay-registry/ca.crt"
    "serverName" (default (printf "%s.%s.svc" (include "kubeloop.controlPlaneRegistryName" .) .Release.Namespace) .Values.dataPlane.relayRegistry.serverName)
    "replayEntries" (int .Values.dataPlane.relayRegistry.replayEntries) }}
  {{- if eq .Values.controlPlane.relayRegistry.authentication "tokenreview" }}
  {{- $_ := set $gatewayRelay "bearerTokenFile" "/var/run/secrets/kubeloop/relay-identity/token" }}
  {{- else }}
  {{- $_ := set $gatewayRelay "clientCertificateFile" "/var/run/secrets/kubeloop/relay-registry/tls.crt" }}
  {{- $_ := set $gatewayRelay "clientPrivateKeyFile" "/var/run/secrets/kubeloop/relay-registry/tls.key" }}
  {{- end }}
  gateway.json: |-
    {{- dict
      "http" (dict "listen" ":8080" "path" .Values.dataPlane.tunnelPath)
      "relay" $gatewayRelay
      "websocket" (dict
        "maxSessions" (int .Values.dataPlane.relayRegistry.maxWebSocketSessions)
        "maxSessionsPerUser" (int .Values.dataPlane.relayRegistry.maxWebSocketSessionsPerUser)
        "maxStreamsPerSession" (int .Values.dataPlane.relayRegistry.maxStreamsPerSession)
        "maxFrameBytes" (int64 .Values.dataPlane.relayRegistry.maxWebSocketFrameBytes)
        "handshakeTimeout" .Values.dataPlane.relayRegistry.handshakeTimeout
        "streamIdleTimeout" .Values.dataPlane.streamIdleTimeout)
      "minClientVersion" .Values.controlPlane.minClientVersion
      "drainTimeout" .Values.dataPlane.drainTimeout
      "logLevel" .Values.dataPlane.logLevel | toPrettyJson | nindent 4 }}
