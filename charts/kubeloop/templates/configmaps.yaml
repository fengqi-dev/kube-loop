{{- $publicURL := required "publicURL is required (for example https://kubeloop.example.com)" .Values.publicURL }}
{{- include "kubeloop.validateExternalAccess" . }}
{{- $development := .Values.controlPlane.development.enabled -}}
{{- if and $development (not (regexMatch "^https://(localhost|127\\.[0-9]+\\.[0-9]+\\.[0-9]+|kubeloop\\.local|kubeloop\\.[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+\\.sslip\\.io)(:[0-9]+)?$" $publicURL)) -}}
{{- fail "controlPlane.development.enabled requires a local, loopback, or kubeloop.<IPv4>.sslip.io publicURL" -}}
{{- end -}}
{{- if not (or (eq .Values.controlPlane.relayRegistry.authentication "tokenreview") (eq .Values.controlPlane.relayRegistry.authentication "mtls")) }}
{{- fail "controlPlane.relayRegistry.authentication must be tokenreview or mtls" }}
{{- end }}
{{- if not .Values.controlPlane.files.allowedRoots }}
{{- fail "controlPlane.files.allowedRoots must contain at least one absolute container path" }}
{{- end }}
{{- if le (int64 .Values.controlPlane.files.maxBytes) 0 }}
{{- fail "controlPlane.files.maxBytes must be positive" }}
{{- end }}
{{- if or (lt (int .Values.dataPlane.relayRegistry.maxWebSocketSessionsPerUser) 1) (gt (int .Values.dataPlane.relayRegistry.maxWebSocketSessionsPerUser) (int .Values.dataPlane.relayRegistry.maxWebSocketSessions)) }}
{{- fail "dataPlane.relayRegistry.maxWebSocketSessionsPerUser must be between 1 and maxWebSocketSessions" }}
{{- end }}
{{- if or (lt (int64 .Values.dataPlane.relayRegistry.maxWebSocketFrameBytes) 8192) (gt (int64 .Values.dataPlane.relayRegistry.maxWebSocketFrameBytes) 16777216) }}
{{- fail "dataPlane.relayRegistry.maxWebSocketFrameBytes must be between 8192 and 16777216" }}
{{- end }}
{{- $management := .Values.controlPlane.management }}
{{- if or (lt (int $management.listenPort) 1) (gt (int $management.listenPort) 65535) }}
{{- fail "controlPlane.management.listenPort must be between 1 and 65535" }}
{{- end }}
{{- if or (lt (int $management.servicePort) 1) (gt (int $management.servicePort) 65535) }}
{{- fail "controlPlane.management.servicePort must be between 1 and 65535" }}
{{- end }}
{{- if eq (int $management.listenPort) 8080 }}
{{- fail "controlPlane.management.listenPort must differ from the public Control Plane port 8080" }}
{{- end }}
{{- if eq (int $management.listenPort) (int .Values.controlPlane.relayRegistry.listenPort) }}
{{- fail "controlPlane.management.listenPort must differ from controlPlane.relayRegistry.listenPort" }}
{{- end }}
{{- $managementPublicURL := required "controlPlane.management.publicURL is required" $management.publicURL }}
{{- $bootstrap := $management.bootstrap }}
{{- range $index, $subject := $bootstrap.subjects }}
{{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $subject) }}
{{- fail (printf "controlPlane.management.bootstrap.subjects[%d] must be an exact stable Principal UUID" $index) }}
{{- end }}
{{- end }}
{{- range $index, $group := $bootstrap.groups }}
{{- if or (not $group) (eq $group "*") (eq $group "$cluster") }}
{{- fail (printf "controlPlane.management.bootstrap.groups[%d] must be an exact stable group" $index) }}
{{- end }}
{{- end }}
{{- if and $bootstrap.recoveryEnabled (not (or $bootstrap.subjects $bootstrap.groups)) }}
{{- fail "controlPlane.management.bootstrap.recoveryEnabled requires a bootstrap subject or group" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeloop.configName" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: configuration
data:
  kubeloop.yaml: |
    controlPlane:
      api:
        listen: ":8080"
        publicURL: {{ $publicURL | quote }}
        serviceID: {{ include "kubeloop.serviceID" . | quote }}
        tunnelPath: {{ .Values.dataPlane.tunnelPath | quote }}
        minClientVersion: {{ .Values.controlPlane.minClientVersion | quote }}
        shutdownTimeout: {{ .Values.controlPlane.shutdownTimeout | quote }}
        requestTimeout: {{ .Values.controlPlane.apiRequestTimeout | quote }}
        maxRequestBodyBytes: {{ int64 .Values.controlPlane.maxRequestBodyBytes }}
      authentication:
        oauth:
          oidcSigningKeyFile: "/var/run/secrets/kubeloop/auth/oauth/oidc-signing-key.pem"
          hmacSecretFile: "/var/run/secrets/kubeloop/auth/oauth/hmac-secret"
          keyID: {{ .Values.controlPlane.auth.oauth.keyID | quote }}
          accessTTL: {{ .Values.controlPlane.auth.oauth.accessTTL | quote }}
          refreshTTL: {{ .Values.controlPlane.auth.oauth.refreshTTL | quote }}
      management:
        listen: {{ printf ":%v" $management.listenPort | quote }}
        publicURL: {{ $managementPublicURL | quote }}
        initialAdmin:
          {{- if .Values.controlPlane.management.initialAdmin.enabled }}
          usernameFile: "/var/run/secrets/kubeloop/management/initial-admin/username"
          passwordFile: "/var/run/secrets/kubeloop/management/initial-admin/password"
          mfaEncryptionKeyFile: "/var/run/secrets/kubeloop/management/initial-admin/mfa-encryption-key"
          {{- end }}
        bootstrap: {{ dict "subjects" (default (list) $bootstrap.subjects) "groups" (default (list) $bootstrap.groups) "recoveryEnabled" $bootstrap.recoveryEnabled | toJson }}
      kubernetes:
        timeout: {{ .Values.controlPlane.kubernetes.timeout | quote }}
        qps: {{ .Values.controlPlane.kubernetes.qps }}
        burst: {{ .Values.controlPlane.kubernetes.burst }}
        userAgent: {{ .Values.controlPlane.kubernetes.userAgent | quote }}
        impersonation: {{ dict "enabled" .Values.controlPlane.kubernetes.impersonation.enabled "usernamePrefix" .Values.controlPlane.kubernetes.impersonation.usernamePrefix "groupMappings" (default (dict) .Values.controlPlane.kubernetes.impersonation.groupMappings) | toJson }}
      relay:
        ticket:
          signingKeyFile: "/var/run/secrets/kubeloop/auth/relay/signing-key.pem"
          keyID: {{ .Values.controlPlane.relay.keyID | quote }}
          ttl: {{ .Values.controlPlane.relay.ticketTTL | quote }}
        registry:
          listen: {{ printf ":%v" .Values.controlPlane.relayRegistry.listenPort | quote }}
          certificateFile: "/var/run/secrets/kubeloop/relay-registry/tls.crt"
          privateKeyFile: "/var/run/secrets/kubeloop/relay-registry/tls.key"
          {{- if eq .Values.controlPlane.relayRegistry.authentication "mtls" }}
          clientCAFile: "/var/run/secrets/kubeloop/relay-registry/ca.crt"
          {{- end }}
          authentication: {{ .Values.controlPlane.relayRegistry.authentication | quote }}
          tokenAudience: {{ .Values.controlPlane.relayRegistry.tokenAudience | quote }}
          trustDomain: {{ .Values.controlPlane.relayRegistry.trustDomain | quote }}
          namespace: {{ .Release.Namespace | quote }}
          serviceAccount: {{ include "kubeloop.dataPlaneServiceAccountName" . | quote }}
          endpointAllowedHosts: {{ .Values.controlPlane.relayRegistry.endpointAllowedHosts | quote }}
          leaseDuration: {{ .Values.controlPlane.relayRegistry.leaseDuration | quote }}
          heartbeatAfter: {{ .Values.controlPlane.relayRegistry.heartbeatAfter | quote }}
          keyGeneration: {{ .Values.controlPlane.relayRegistry.keyGeneration }}
          keyValidity: {{ .Values.controlPlane.relayRegistry.keyValidity | quote }}
      sessions:
        ttl: {{ .Values.controlPlane.sessionTTL | quote }}
        maxLifetime: {{ .Values.controlPlane.sessionMaxLifetime | quote }}
      storage:
        replicas: {{ .Values.controlPlane.replicas }}
        sqlite:
          path: {{ .Values.controlPlane.storage.sqlite.path | quote }}
        {{- if .Values.controlPlane.storage.datasource.existingSecret }}
        datasourceURLFile: "/var/run/secrets/kubeloop/storage/datasource-url"
        allowInsecureDatasource: {{ .Values.controlPlane.storage.datasource.allowInsecure }}
        {{- end }}
        connectTimeout: {{ .Values.controlPlane.storage.connectTimeout | quote }}
        queryTimeout: {{ .Values.controlPlane.storage.queryTimeout | quote }}
        maxOpenConnections: {{ .Values.controlPlane.storage.maxOpenConnections }}
        maxIdleConnections: {{ .Values.controlPlane.storage.maxIdleConnections }}
        connectionMaxLifetime: {{ .Values.controlPlane.storage.connectionMaxLifetime | quote }}
        transactionMaxRetries: {{ .Values.controlPlane.storage.transactionMaxRetries }}
        transactionRetryBackoff: {{ .Values.controlPlane.storage.transactionRetryBackoff | quote }}
      maintenance:
        interval: {{ .Values.controlPlane.maintenanceInterval | quote }}
        batchSize: {{ .Values.controlPlane.maintenanceBatchSize }}
      files:
        maxBytes: {{ int64 .Values.controlPlane.files.maxBytes }}
        allowedRoots: {{ .Values.controlPlane.files.allowedRoots | toJson }}
      logging:
        level: {{ lower (toString .Values.controlPlane.logLevel) | quote }}
  {{- if and (not .Values.dataPlane.relayRegistry.endpoint) (not (hasPrefix "https://" $publicURL)) }}
  {{- fail "dataPlane.relayRegistry.endpoint is required when publicURL is not HTTPS" }}
  {{- end }}
  {{- $gatewayRelay := dict
    "controlPlaneURL" (default (printf "https://%s.%s.svc:%v" (include "kubeloop.controlPlaneRegistryName" .) .Release.Namespace .Values.controlPlane.relayRegistry.servicePort) .Values.dataPlane.relayRegistry.controlPlaneURL)
    "endpoint" (default (printf "wss://%s%s" (trimPrefix "https://" (trimSuffix "/" $publicURL)) .Values.dataPlane.tunnelPath) .Values.dataPlane.relayRegistry.endpoint)
    "serverCAFile" "/var/run/secrets/kubeloop/relay-registry/ca.crt"
    "serverName" (default (printf "%s.%s.svc" (include "kubeloop.controlPlaneRegistryName" .) .Release.Namespace) .Values.dataPlane.relayRegistry.serverName)
    "replayEntries" (int .Values.dataPlane.relayRegistry.replayEntries) }}
  {{- if eq .Values.controlPlane.relayRegistry.authentication "tokenreview" }}
  {{- $_ := set $gatewayRelay "bearerTokenFile" "/var/run/secrets/kubeloop/relay-identity/token" }}
  {{- else }}
  {{- $_ := set $gatewayRelay "clientCertificateFile" "/var/run/secrets/kubeloop/relay-registry/tls.crt" }}
  {{- $_ := set $gatewayRelay "clientPrivateKeyFile" "/var/run/secrets/kubeloop/relay-registry/tls.key" }}
  {{- end }}
    gateway:
    {{- dict
      "http" (dict "listen" ":8080" "path" .Values.dataPlane.tunnelPath)
      "relay" $gatewayRelay
      "websocket" (dict
        "maxSessions" (int .Values.dataPlane.relayRegistry.maxWebSocketSessions)
        "maxSessionsPerUser" (int .Values.dataPlane.relayRegistry.maxWebSocketSessionsPerUser)
        "maxStreamsPerSession" (int .Values.dataPlane.relayRegistry.maxStreamsPerSession)
        "maxFrameBytes" (int64 .Values.dataPlane.relayRegistry.maxWebSocketFrameBytes)
        "handshakeTimeout" .Values.dataPlane.relayRegistry.handshakeTimeout
        "streamIdleTimeout" .Values.dataPlane.streamIdleTimeout)
      "minClientVersion" .Values.controlPlane.minClientVersion
      "drainTimeout" .Values.dataPlane.drainTimeout
      "logLevel" .Values.dataPlane.logLevel | toYaml | nindent 6 }}
