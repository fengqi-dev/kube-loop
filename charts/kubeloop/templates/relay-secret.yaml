{{- $name := include "kubeloop.relaySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $serviceDNS := printf "%s.%s.svc" (include "kubeloop.controlPlaneRegistryName" .) .Release.Namespace -}}
{{- $ca := genCA (printf "%s CA" $serviceDNS) 3651 -}}
{{- $certificate := genSignedCert $serviceDNS nil (list $serviceDNS) 3650 $ca -}}
{{- $signingKey := genPrivateKey "ed25519" | b64enc -}}
{{- $tlsCertificate := $certificate.Cert | b64enc -}}
{{- $tlsPrivateKey := $certificate.Key | b64enc -}}
{{- $caCertificate := $ca.Cert | b64enc -}}
{{- if and $existing $existing.data (index $existing.data "signing-key.pem") (index $existing.data "tls.crt") (index $existing.data "tls.key") (index $existing.data "ca.crt") -}}
{{- $signingKey = index $existing.data "signing-key.pem" -}}
{{- $tlsCertificate = index $existing.data "tls.crt" -}}
{{- $tlsPrivateKey = index $existing.data "tls.key" -}}
{{- $caCertificate = index $existing.data "ca.crt" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  signing-key.pem: {{ $signingKey | quote }}
  tls.crt: {{ $tlsCertificate | quote }}
  tls.key: {{ $tlsPrivateKey | quote }}
  ca.crt: {{ $caCertificate | quote }}
