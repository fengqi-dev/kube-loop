{{- if lt (int .Values.operator.replicas) 1 -}}
{{- fail "operator.replicas must be at least 1" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeloop.operatorName" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "kubeloop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      annotations:
        checksum/trafficbinding-crd: {{ .Files.Get "crds/traffic.kubeloop.io_trafficbindings.yaml" | sha256sum }}
      {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubeloop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kubeloop.operatorServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.operator.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "kubeloop.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --crd-file=/etc/kubeloop/crd/trafficbinding-crd.yaml
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
            - --leader-elect={{ .Values.operator.leaderElection }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: trafficbinding-crd
              mountPath: /etc/kubeloop/crd
              readOnly: true
      volumes:
        - name: trafficbinding-crd
          configMap:
            name: {{ include "kubeloop.operatorName" . }}-crd
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
