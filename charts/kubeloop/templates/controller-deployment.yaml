{{- $publicURL := required "publicURL is required (for example https://kubeloop.example.com)" .Values.publicURL -}}
{{- $storageType := .Values.controller.storage.type -}}
{{- if and (ne $storageType "sqlite") (ne $storageType "postgresql") -}}
{{- fail "controller.storage.type must be sqlite or postgresql" -}}
{{- end -}}
{{- if and (eq $storageType "sqlite") (ne (int .Values.controller.replicas) 1) -}}
{{- fail "controller.replicas must be 1 when controller.storage.type=sqlite" -}}
{{- end -}}
{{- if and (eq $storageType "postgresql") (not .Values.controller.storage.postgresql.existingSecret) -}}
{{- fail "controller.storage.postgresql.existingSecret is required for postgresql storage" -}}
{{- end }}
{{- if and (eq $storageType "postgresql") (le (int .Values.controller.storage.postgresql.maxOpenConnections) 0) -}}
{{- fail "controller.storage.postgresql.maxOpenConnections must be positive" -}}
{{- end }}
{{- if and (eq $storageType "postgresql") (lt (int .Values.controller.storage.postgresql.maxIdleConnections) 0) -}}
{{- fail "controller.storage.postgresql.maxIdleConnections must not be negative" -}}
{{- end }}
{{- if and (eq $storageType "postgresql") (gt (int .Values.controller.storage.postgresql.maxIdleConnections) (int .Values.controller.storage.postgresql.maxOpenConnections)) -}}
{{- fail "controller.storage.postgresql.maxIdleConnections must not exceed maxOpenConnections" -}}
{{- end }}
{{- if and (eq $storageType "postgresql") (or (lt (int .Values.controller.storage.postgresql.transactionMaxRetries) 0) (gt (int .Values.controller.storage.postgresql.transactionMaxRetries) 10)) -}}
{{- fail "controller.storage.postgresql.transactionMaxRetries must be between 0 and 10" -}}
{{- end }}
{{- if and .Values.controller.relayRegistry.enabled (ne (int .Values.controller.replicas) 1) -}}
{{- fail "controller.replicas must be 1 while the in-memory Relay Registry is enabled" -}}
{{- end }}
{{- if and (not .Values.controller.relayRegistry.enabled) (ne .Values.controller.relay.id .Values.dataPlane.relay.id) -}}
{{- fail "controller.relay.id and dataPlane.relay.id must match" -}}
{{- end }}
{{- $controllerLogLevel := lower (toString .Values.controller.logLevel) -}}
{{- if not (has $controllerLogLevel (list "debug" "info" "warn" "error")) -}}
{{- fail "controller.logLevel must be debug, info, warn, or error" -}}
{{- end }}
{{- $breakGlass := .Values.controller.management.breakGlass -}}
{{- $breakGlassAlias := trim (toString $breakGlass.secretAlias) -}}
{{- $breakGlassSecret := dict -}}
{{- $providerSecretAliases := default (dict) .Values.controller.management.providerSecretAliases -}}
{{- if $breakGlass.enabled -}}
{{- if not (regexMatch "^[a-z][a-z0-9-]{0,62}$" $breakGlassAlias) -}}
{{- fail "controller.management.breakGlass.secretAlias must be a valid stable alias" -}}
{{- end -}}
{{- $breakGlassSecret = get (default (dict) $breakGlass.secretAliases) $breakGlassAlias -}}
{{- if not $breakGlassSecret -}}
{{- fail "controller.management.breakGlass.secretAlias must select a configured secretAliases entry" -}}
{{- end -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeloop.controllerName" . }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: {{ ternary "Recreate" "RollingUpdate" (eq $storageType "sqlite") }}
  selector:
    matchLabels:
      {{- include "kubeloop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubeloop.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kubeloop.controllerServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "kubeloop.controllerImage" . | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - --api-request-timeout={{ .Values.controller.apiRequestTimeout }}
            - --max-request-body-bytes={{ int64 .Values.controller.maxRequestBodyBytes }}
            - --session-ttl={{ .Values.controller.sessionTTL }}
            - --session-max-lifetime={{ .Values.controller.sessionMaxLifetime }}
            - --maintenance-interval={{ .Values.controller.maintenanceInterval }}
            - --maintenance-batch-size={{ int .Values.controller.maintenanceBatchSize }}
            - --relay-ticket-ttl={{ .Values.controller.relay.ticketTTL }}
            - --shutdown-timeout={{ .Values.controller.shutdownTimeout }}
            - --log-level={{ $controllerLogLevel }}
          envFrom:
            - configMapRef:
                name: {{ include "kubeloop.controllerConfigName" . }}
          env:
            - name: KUBELOOP_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBELOOP_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.controller.relayRegistry.enabled }}
            - name: KUBELOOP_RELAY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBELOOP_RELAY_SERVICE_ACCOUNT
              value: {{ include "kubeloop.dataPlaneServiceAccountName" . | quote }}
            {{- end }}
            - name: KUBELOOP_STORAGE_TYPE
              value: {{ $storageType | quote }}
            {{- if eq $storageType "sqlite" }}
            - name: KUBELOOP_SQLITE_PATH
              value: {{ .Values.controller.storage.sqlite.path | quote }}
            {{- else }}
            - name: KUBELOOP_POSTGRESQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.storage.postgresql.existingSecret }}
                  key: {{ .Values.controller.storage.postgresql.dsnKey }}
            - name: KUBELOOP_POSTGRESQL_CONNECT_TIMEOUT
              value: {{ .Values.controller.storage.postgresql.connectTimeout | quote }}
            - name: KUBELOOP_POSTGRESQL_QUERY_TIMEOUT
              value: {{ .Values.controller.storage.postgresql.queryTimeout | quote }}
            - name: KUBELOOP_POSTGRESQL_MAX_OPEN_CONNECTIONS
              value: {{ int .Values.controller.storage.postgresql.maxOpenConnections | quote }}
            - name: KUBELOOP_POSTGRESQL_MAX_IDLE_CONNECTIONS
              value: {{ int .Values.controller.storage.postgresql.maxIdleConnections | quote }}
            - name: KUBELOOP_POSTGRESQL_CONNECTION_MAX_LIFETIME
              value: {{ .Values.controller.storage.postgresql.connectionMaxLifetime | quote }}
            - name: KUBELOOP_POSTGRESQL_TRANSACTION_MAX_RETRIES
              value: {{ int .Values.controller.storage.postgresql.transactionMaxRetries | quote }}
            - name: KUBELOOP_POSTGRESQL_TRANSACTION_RETRY_BACKOFF
              value: {{ .Values.controller.storage.postgresql.transactionRetryBackoff | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.controller.relayRegistry.enabled }}
            - name: relay-mtls
              containerPort: {{ .Values.controller.relayRegistry.listenPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: auth-config
              mountPath: /etc/kubeloop/auth
              readOnly: true
            - name: auth-secrets
              mountPath: /var/run/secrets/kubeloop/auth
              readOnly: true
            {{- if or $breakGlass.enabled $providerSecretAliases }}
            - name: management-secrets
              mountPath: /var/run/secrets/kubeloop/management
              readOnly: true
            {{- end }}
            {{- if .Values.controller.relayRegistry.enabled }}
            - name: relay-registry-tls
              mountPath: /var/run/secrets/kubeloop/relay-registry
              readOnly: true
            {{- end }}
            {{- if eq $storageType "sqlite" }}
            - name: data
              mountPath: {{ dir .Values.controller.storage.sqlite.path }}
            {{- end }}
      volumes:
        - name: auth-config
          configMap:
            name: {{ include "kubeloop.controllerAuthConfigName" . }}
        - name: auth-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ required "controller.relay.existingSecret is required" .Values.controller.relay.existingSecret }}
                  items:
                    - key: {{ required "controller.relay.signingKeyKey is required" .Values.controller.relay.signingKeyKey }}
                      path: relay/signing-key.pem
              {{- if or .Values.controller.auth.providers $providerSecretAliases }}
              - secret:
                  name: {{ required "controller.auth.token.existingSecret is required" .Values.controller.auth.token.existingSecret }}
                  items:
                    - key: {{ required "controller.auth.token.signingKeyKey is required" .Values.controller.auth.token.signingKeyKey }}
                      path: token/signing-key.pem
              {{- end }}
              {{- if .Values.controller.auth.providers }}
              {{- range $index, $provider := .Values.controller.auth.providers }}
              {{- $id := required (printf "controller.auth.providers[%d].id is required" $index) $provider.id }}
              {{- $type := required (printf "controller.auth.providers[%d].type is required" $index) $provider.type }}
              {{- if eq $type "oidc" }}
              {{- $oidc := required (printf "controller.auth.providers[%d].oidc is required" $index) $provider.oidc }}
              - secret:
                  name: {{ required (printf "controller.auth.providers[%d].oidc.existingSecret is required" $index) $oidc.existingSecret }}
                  items:
                    - key: {{ required (printf "controller.auth.providers[%d].oidc.clientSecretKey is required" $index) $oidc.clientSecretKey }}
                      path: {{ printf "%s/client-secret" $id | quote }}
                    {{- if $oidc.caKey }}
                    - key: {{ $oidc.caKey }}
                      path: {{ printf "%s/ca.crt" $id | quote }}
                    {{- end }}
              {{- else if eq $type "ad" }}
              {{- $ad := required (printf "controller.auth.providers[%d].ad is required" $index) $provider.ad }}
              {{- if or $ad.bindDN $ad.caKey }}
              - secret:
                  name: {{ required (printf "controller.auth.providers[%d].ad.existingSecret is required for configured AD secrets" $index) $ad.existingSecret }}
                  items:
                    {{- if $ad.bindDN }}
                    - key: {{ required (printf "controller.auth.providers[%d].ad.bindPasswordKey is required when bindDN is configured" $index) $ad.bindPasswordKey }}
                      path: {{ printf "%s/bind-password" $id | quote }}
                    {{- end }}
                    {{- if $ad.caKey }}
                    - key: {{ $ad.caKey }}
                      path: {{ printf "%s/ca.crt" $id | quote }}
                    {{- end }}
              {{- end }}
              {{- else if eq $type "static-token" }}
              {{- $staticToken := required (printf "controller.auth.providers[%d].staticToken is required" $index) $provider.staticToken }}
              - secret:
                  name: {{ required (printf "controller.auth.providers[%d].staticToken.existingSecret is required" $index) $staticToken.existingSecret }}
                  items:
                    - key: {{ required (printf "controller.auth.providers[%d].staticToken.tokenKey is required" $index) $staticToken.tokenKey }}
                      path: {{ printf "%s/static-token" $id | quote }}
              {{- else if eq $type "anonymous" }}
              {{- else }}
              {{- fail (printf "controller.auth.providers[%d].type must be oidc, ad, static-token, or anonymous" $index) }}
              {{- end }}
              {{- end }}
              {{- end }}
        {{- if or $breakGlass.enabled $providerSecretAliases }}
        - name: management-secrets
          projected:
            defaultMode: 0400
            sources:
              {{- if $breakGlass.enabled }}
              - secret:
                  name: {{ required (printf "controller.management.breakGlass.secretAliases.%s.existingSecret is required" $breakGlassAlias) $breakGlassSecret.existingSecret }}
                  items:
                    - key: {{ required (printf "controller.management.breakGlass.secretAliases.%s.credentialKey is required" $breakGlassAlias) $breakGlassSecret.credentialKey }}
                      path: {{ printf "break-glass/%s/credential" $breakGlassAlias | quote }}
              {{- end }}
              {{- range $alias, $secret := $providerSecretAliases }}
              - secret:
                  name: {{ required (printf "controller.management.providerSecretAliases.%s.existingSecret is required" $alias) $secret.existingSecret }}
                  items:
                    {{- if $secret.clientSecretKey }}
                    - key: {{ $secret.clientSecretKey }}
                      path: {{ printf "providers/%s/client-secret" $alias | quote }}
                    {{- end }}
                    {{- if $secret.bindPasswordKey }}
                    - key: {{ $secret.bindPasswordKey }}
                      path: {{ printf "providers/%s/bind-password" $alias | quote }}
                    {{- end }}
                    {{- if $secret.caKey }}
                    - key: {{ $secret.caKey }}
                      path: {{ printf "providers/%s/ca.crt" $alias | quote }}
                    {{- end }}
              {{- end }}
        {{- end }}
        {{- if .Values.controller.relayRegistry.enabled }}
        - name: relay-registry-tls
          secret:
            secretName: {{ default .Values.controller.relay.existingSecret .Values.controller.relayRegistry.existingSecret | required "controller.relayRegistry.existingSecret or controller.relay.existingSecret is required" }}
            defaultMode: 0400
            items:
              - key: {{ required "controller.relayRegistry.serverCertificateKey is required" .Values.controller.relayRegistry.serverCertificateKey }}
                path: tls.crt
              - key: {{ required "controller.relayRegistry.serverPrivateKeyKey is required" .Values.controller.relayRegistry.serverPrivateKeyKey }}
                path: tls.key
              - key: {{ required "controller.relayRegistry.caKey is required" .Values.controller.relayRegistry.caKey }}
                path: ca.crt
        {{- end }}
        {{- if eq $storageType "sqlite" }}
        - name: data
          {{- if .Values.controller.storage.sqlite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubeloop.sqliteClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
