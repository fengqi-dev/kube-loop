{{- $initialAdmin := .Values.controlPlane.management.initialAdmin -}}
{{- if and $initialAdmin.enabled (not $initialAdmin.existingSecret) -}}
{{- $name := include "kubeloop.initialAdminSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $usernameKey := required "controlPlane.management.initialAdmin.usernameKey is required" $initialAdmin.usernameKey -}}
{{- $passwordKey := required "controlPlane.management.initialAdmin.passwordKey is required" $initialAdmin.passwordKey -}}
{{- $mfaKey := required "controlPlane.management.initialAdmin.mfaEncryptionKeyKey is required" $initialAdmin.mfaEncryptionKeyKey -}}
{{- $tokenKey := required "controlPlane.auth.token.signingKeyKey is required" .Values.controlPlane.auth.token.signingKeyKey -}}
{{- $username := required "controlPlane.management.initialAdmin.username is required" $initialAdmin.username | toString | b64enc -}}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- $encryptionKey := randBytes 32 -}}
{{- $tokenSigningKey := genPrivateKey "ed25519" | b64enc -}}
{{- if and $existing $existing.data -}}
{{- $username = default $username (index $existing.data $usernameKey) -}}
{{- $password = default $password (index $existing.data $passwordKey) -}}
{{- $encryptionKey = default $encryptionKey (index $existing.data $mfaKey) -}}
{{- $tokenSigningKey = default $tokenSigningKey (index $existing.data $tokenKey) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $usernameKey }}: {{ $username | quote }}
  {{ $passwordKey }}: {{ $password | quote }}
  {{ $mfaKey }}: {{ $encryptionKey | quote }}
  {{ $tokenKey }}: {{ $tokenSigningKey | quote }}
{{- end }}
