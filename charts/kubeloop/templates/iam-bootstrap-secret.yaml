{{- $bootstrap := .Values.controlPlane.admin.bootstrap -}}
{{- if and $bootstrap.enabled (not $bootstrap.existingSecret) -}}
{{- $name := include "kubeloop.iamBootstrapSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $passwordKey := required "controlPlane.admin.bootstrap.passwordKey is required" $bootstrap.passwordKey -}}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- if and $existing $existing.data -}}
{{- $password = default $password (index $existing.data $passwordKey) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $passwordKey }}: {{ $password | quote }}
{{- end }}
