<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · KubeLoop</title>
  <link rel="stylesheet" href="/oauth2/assets/login.css">
</head>
<body>
  <main class="page-shell">
    <section class="brand-panel" aria-labelledby="brand-title">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">KL</span>
        <span>KubeLoop Control</span>
      </div>

      <div class="brand-copy">
        <span class="eyebrow">Secure management access</span>
        <h1 id="brand-title">让集群连接，<br>保持简单。</h1>
        <p>通过统一身份、最小权限与可审计会话，安全访问 KubeLoop 管理平面。</p>
      </div>

      <div class="trust-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.7 2.9 8 7 10 4.1-2 7-5.3 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>OAuth 2.0 · OIDC · PKCE S256</span>
      </div>
    </section>

    <section class="auth-panel" aria-labelledby="login-title">
      <div class="mobile-brand">
        <span class="brand-mark" aria-hidden="true">KL</span>
        <span>KubeLoop Control</span>
      </div>

      <div class="card">
        <header class="card-header">
          <span class="badge">
            <span class="status-dot" aria-hidden="true"></span>
            Local account
          </span>
          <h2 id="login-title">欢迎回来</h2>
          <p>输入本地管理员凭据以继续访问管理后台。</p>
        </header>

        <form method="post" action="/oauth2/login/local" class="form-stack">
          <input type="hidden" name="transaction" value="{{.Transaction}}">

          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" inputmode="text" placeholder="admin" autofocus required>
          </div>

          <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="输入登录密码" required>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="second-factor">MFA 或恢复码</label>
              <span>可选</span>
            </div>
            <input id="second-factor" name="second_factor" autocomplete="one-time-code" inputmode="numeric" placeholder="已启用 MFA 时填写">
            <p class="field-help">输入 6 位动态验证码，或一条未使用的恢复码。</p>
          </div>

          <button type="submit">
            <span>登录管理后台</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </form>

        <footer class="card-footer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>凭据仅发送到当前 KubeLoop Control Plane</span>
        </footer>
      </div>
    </section>
  </main>
</body>
</html>
