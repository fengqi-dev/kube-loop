name: Full UI E2E

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-ui-e2e:
    name: Admin browser and native macOS UI
    runs-on: [self-hosted, macOS, kubeloop-ui-e2e-macos]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/ui/admin/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Run isolated real UI environment
        env:
          CI: "true"
          KUBELOOP_UI_E2E: "1"
          KUBELOOP_UI_E2E_ARTIFACTS: ${{ github.workspace }}/build/ui-e2e
        run: ./e2e/ui/run-real-environment.sh

      - name: Upload UI E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-ui-e2e-${{ github.run_attempt }}
          path: build/ui-e2e
          if-no-files-found: warn
          retention-days: 14
