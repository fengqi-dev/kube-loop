name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  tui:
    name: TUI (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            artifact: tui-darwin-arm64
            e2e: false
          - name: macOS amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            artifact: tui-darwin-amd64
            e2e: false
          - name: Windows amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            artifact: tui-windows-amd64
            e2e: false
          - name: Windows arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            artifact: tui-windows-arm64
            e2e: false
          - name: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: tui-linux-amd64
            e2e: true
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: tui-linux-arm64
            e2e: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PTY E2E dependency
        if: matrix.e2e
        shell: bash
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM 10m \
            bash -euo pipefail -c '
              apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update
              apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                install --yes --no-install-recommends expect
            '

      - name: Run TUI PTY E2E release gate
        if: matrix.e2e
        run: make tui-test-e2e

      - name: Build and package TUI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="dist/stage-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${stage}"
          make tui \
            VERSION="${GITHUB_REF_NAME}" \
            TUI_GOOS="${{ matrix.goos }}" \
            TUI_GOARCH="${{ matrix.goarch }}" \
            TUI_BINARY="${stage}/kubeloop"
          tar -C "${stage}" -czf \
            "dist/kubeloop-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            kubeloop
          rm -rf "${stage}"

      - name: Build and package TUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ("${{ github.ref_name }}" -replace '^v', '')
          $stage = "dist/stage-windows-${{ matrix.goarch }}"
          $env:VITE_APP_VERSION = "${{ github.ref_name }}"
          Remove-Item -Recurse -Force build/bin/resources -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path build/bin/resources | Out-Null
          go run ./build/helper-prebuild.go "windows/${{ matrix.goarch }}"
          go run ./build/stage-package-assets.go "windows/${{ matrix.goarch }}"
          Copy-Item build/embedded/kubeloop-helper.exe build/bin/resources/
          Copy-Item build/bin/sing-box.exe build/bin/resources/
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $embedDir = "cmd/kubeloop-tui/embedded"
          Remove-Item -Recurse -Force $embedDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $embedDir | Out-Null
          Copy-Item build/bin/resources/* $embedDir/
          go build -trimpath `
            -tags kubeloop_embed `
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" `
            -o "$stage/kubeloop.exe" `
            ./cmd/kubeloop-tui
          Remove-Item -Recurse -Force $embedDir
          tar.exe -C $stage -czf "dist/kubeloop-$version-windows-${{ matrix.goarch }}.tar.gz" kubeloop.exe
          Remove-Item -Recurse -Force $stage

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/kubeloop-*.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            artifact: desktop-darwin-arm64
          - name: macOS amd64
            runner: macos-15-intel
            artifact: desktop-darwin-amd64
          - name: Windows amd64
            runner: windows-latest
            artifact: desktop-windows-amd64
          - name: Windows arm64
            runner: windows-11-arm
            artifact: desktop-windows-arm64
          - name: Linux amd64
            runner: ubuntu-24.04
            artifact: desktop-linux-amd64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            artifact: desktop-linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM 10m \
            bash -euo pipefail -c '
              apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update
              apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                install --yes --no-install-recommends \
                libgtk-3-dev \
                libwebkit2gtk-4.1-dev
            '

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync product version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          ref_name = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:[-+].*)?",
              ref_name,
          )
          if match is None:
              raise SystemExit(f"release tag is not a supported SemVer: {ref_name}")
          parts = [int(value) for value in match.groups()]
          if any(value > 65535 for value in parts):
              raise SystemExit(f"release version exceeds Windows version limits: {ref_name}")
          # Wails and the NSIS template append the fourth numeric component.
          # Keep prerelease/build metadata in the application version injected
          # below, while package metadata receives a valid X.X.X.0 version.
          product_version = ".".join(str(value) for value in parts)

          path = pathlib.Path("wails.json")
          data = json.loads(path.read_text())
          data.setdefault("info", {})["productVersion"] = product_version
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"productVersion={product_version}")
          PY

      - name: Build desktop application
        if: runner.os != 'Windows'
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            wails build -clean -tags webkit2_41 \
              -ldflags "-X main.version=${GITHUB_REF_NAME}"
          else
            wails build -clean -ldflags "-X main.version=${GITHUB_REF_NAME}"
          fi

      - name: Build desktop application
        if: runner.os == 'Windows'
        shell: bash
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          wails build -clean -nsis -ldflags "-X main.version=${GITHUB_REF_NAME}"

      - name: Package desktop application
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: ./build/package-desktop.sh

      - name: Package desktop application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = (go env GOARCH).Trim()
          $version = ("${{ github.ref_name }}" -replace '^v', '')
          $stage = New-Item -ItemType Directory -Force -Path "dist/stage-windows"
          Copy-Item "build/bin/KubeLoop.exe" $stage.FullName
          Copy-Item "build/bin/sing-box.exe" $stage.FullName
          Copy-Item "build/bin/LICENSE.sing-box.txt" $stage.FullName
          foreach ($sidecar in @("libcronet.dll", "wintun.dll")) {
            $path = Join-Path "build/bin" $sidecar
            if (Test-Path $path) { Copy-Item $path $stage.FullName }
          }
          Copy-Item -Recurse "build/bin/resources" $stage.FullName
          Compress-Archive -Path "$($stage.FullName)\*" -DestinationPath "dist/kubeloop-$version-windows-$arch.zip"
          Remove-Item -Recurse -Force $stage.FullName
          $installer = Get-ChildItem "build/bin/*-installer.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found in build/bin"
          }
          Copy-Item $installer.FullName "dist/kubeloop-$version-windows-$arch-installer.exe"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  container-images:
    name: OCI / ${{ matrix.display-name }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - display-name: Gateway
            image-name: gateway
            dockerfile: build/gateway.Dockerfile
          - display-name: Control Plane
            image-name: control-plane
            dockerfile: build/control-plane.Dockerfile
          - display-name: Operator
            image-name: operator
            dockerfile: build/operator.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image-name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push ${{ matrix.display-name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  helm-chart:
    name: OCI / Helm chart
    needs: container-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Publish Helm chart to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          chart_version="$(helm show chart charts/kubeloop | awk '$1 == "version:" { print $2 }')"
          app_version="$(helm show chart charts/kubeloop | awk '$1 == "appVersion:" { print $2 }')"
          if [[ "${chart_version}" != "${release_version}" ]]; then
            echo "Chart version ${chart_version} does not match release ${release_version}" >&2
            exit 1
          fi
          if [[ "${app_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Chart appVersion ${app_version} does not match image tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          helm lint charts/kubeloop
          chart_dir="$(mktemp -d)"
          helm package charts/kubeloop --destination "${chart_dir}"
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          helm push "${chart_dir}/kubeloop-${release_version}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY}/charts"

  publish:
    name: Publish GitHub Release
    needs:
      - tui
      - desktop
      - helm-chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Download desktop artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Download TUI artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: tui-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          # Prefer bare filenames (no "./" prefix) so consumers can match by asset name.
          sha256sum -- * > SHA256SUMS

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Hyphenated tags (v1.1.0-rc.1) are GitHub pre-releases.
          # Plain vX.Y.Z can still be pre-created with: gh release create TAG --prerelease
          prerelease_args=()
          if [[ "${tag}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Re-runs / rebuilt matrices: replace assets on the existing release.
            gh release upload "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${tag}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "KubeLoop ${tag}" \
              "${prerelease_args[@]}"
          fi

  homebrew:
    name: Update Homebrew Cask and Formula
    needs: publish
    # Skip hyphenated pre-release tags (v1.1.0-rc.1).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump Casks/kubeloop.rb
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./build/update-homebrew-cask.sh

      - name: Bump Formula/kubeloop.rb
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash ./build/update-homebrew-formula.sh

      - name: Commit and push Homebrew bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kubeloop.rb Formula/kubeloop.rb
          if git diff --staged --quiet; then
            echo "Homebrew cask and formula already up to date"
            exit 0
          fi
          # [skip ci] prevents the bump commit from re-running CI/Pages.
          git commit -m "chore(homebrew): bump packages to ${GITHUB_REF_NAME} [skip ci]"
          git push

  pages:
    name: Deploy Pages
    needs: publish
    # github-pages env only allows main; dispatch Pages from the default branch
    # instead of deploying from the release tag ref.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Pages on default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
