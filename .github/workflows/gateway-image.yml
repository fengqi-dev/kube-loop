name: Publish Gateway v2 Image

on:
  push:
    branches:
      - v2
    paths:
      - ".github/workflows/gateway-image.yml"
      - "build/gateway.Dockerfile"
      - "cmd/kubeloop-gateway/**"
      - "internal/gateway/**"
      - "internal/tunnel/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

concurrency:
  group: gateway-image-v2
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish linux/amd64 and linux/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/gateway
          tags: |
            type=raw,value=v2
            type=sha,prefix=v2-

      - name: Build and push Gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/gateway.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=v2-${{ github.sha }}
          cache-from: type=gha,scope=gateway-v2
          cache-to: type=gha,mode=max,scope=gateway-v2
